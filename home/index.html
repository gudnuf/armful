<script>
/* Recent armfuls: collections this browser opened, drawn only when there are some.
   The shared shape (the collection page writes it, this page only reads it):
     localStorage["armful:recent"] = JSON array, newest first, at most 6, one per slug:
       { slug: "<collection slug, ^[a-z0-9-]{6,}$, not reserved>",
         title: "<plain text, 1-80 chars>",
         door: "<door photo Drive id, ^[A-Za-z0-9_-]{10,200}$>" or null,
         t: <ms since the epoch, when it was last opened> }
   Anything that does not match is skipped. Nothing here is ever sent anywhere. */
(function () {
  try {
    var list = JSON.parse(localStorage.getItem("armful:recent") || "[]");
    if (!Array.isArray(list)) return;
    var SLUG = /^[a-z0-9-]{6,}$/, DOOR = /^[A-Za-z0-9_-]{10,200}$/, seen = {}, ok = [];
    var RESERVED = ["app", "api", "a", "c", "about", "login", "new", "open", "static", "_"];
    for (var i = 0; i < list.length && ok.length < 6; i++) {
      var r = list[i];
      if (!r || typeof r !== "object") continue;
      if (typeof r.slug !== "string" || !SLUG.test(r.slug) || RESERVED.indexOf(r.slug) >= 0 || seen[r.slug]) continue;
      if (typeof r.title !== "string" || !r.title.trim() || r.title.length > 80) continue;
      if (r.door != null && (typeof r.door !== "string" || !DOOR.test(r.door))) continue;
      if (r.t != null && (typeof r.t !== "number" || !isFinite(r.t))) continue;
      seen[r.slug] = 1;
      ok.push({ slug: r.slug, title: r.title.trim(), door: r.door || null });
    }
    if (!ok.length) return;
    var sec = document.createElement("section"), lbl = document.createElement("p"), ul = document.createElement("ul");
    sec.className = "recent"; sec.setAttribute("aria-labelledby", "recent-lbl");
    lbl.className = "lbl"; lbl.id = "recent-lbl"; lbl.textContent = "Recent";
    ul.className = "cards";
    ok.forEach(function (c) {
      var li = document.createElement("li"), a = document.createElement("a"), box = document.createElement("span"), t = document.createElement("span");
      a.className = "card"; a.href = "/" + c.slug + "/";
      box.className = "thumb";
      if (c.door) {
        var img = document.createElement("img");
        img.alt = ""; img.loading = "lazy"; img.decoding = "async"; img.referrerPolicy = "no-referrer";
        img.addEventListener("load", function () { img.className = "in"; });
        img.addEventListener("error", function () { img.remove(); });
        img.src = "https://drive.google.com/thumbnail?id=" + encodeURIComponent(c.door) + "&sz=w400";
        box.appendChild(img);
      }
      t.className = "name"; t.textContent = c.title;
      a.appendChild(box); a.appendChild(t); li.appendChild(a); ul.appendChild(li);
    });
    sec.appendChild(lbl); sec.appendChild(ul);
    document.querySelector("main").appendChild(sec);
  } catch (e) {}
})();
</script>
